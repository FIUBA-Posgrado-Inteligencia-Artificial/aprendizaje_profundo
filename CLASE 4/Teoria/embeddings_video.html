<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embeddings en movimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070d; --ink:#e8ecf5; --dim:#8a93a8;
  --c1:#4cc9f0; --c2:#f72585; --c3:#ffb703; --c4:#80ed99; --c5:#b388ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:1920px;height:1080px;display:block}

/* Etiqueta de sección (HTML + CSS) */
#sec{position:absolute;left:72px;top:52px;display:flex;align-items:center;gap:16px;font-size:22px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:0;will-change:opacity,transform}
#sec .num{font-family:"JetBrains Mono",Consolas,monospace;color:var(--bg);background:var(--secc,var(--c1));
  padding:4px 12px;border-radius:8px;letter-spacing:0;font-weight:600}
#sec .bar{width:60px;height:2px;background:linear-gradient(90deg,var(--secc,var(--c1)),transparent)}

/* Subtítulo / narración en pantalla */
#cap{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:1560px;width:max-content;
  text-align:center;font-size:34px;line-height:1.35;font-weight:400;padding:16px 34px;border-radius:16px;
  background:rgba(6,9,17,.74);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);
  box-shadow:0 10px 40px rgba(0,0,0,.45);opacity:0;will-change:opacity,transform}
#cap b{color:var(--c3);font-weight:600}
#cap.empty{display:none}

/* Controles (fuera del encuadre de grabación, se ocultan solos) */
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;padding:10px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,0));transition:opacity .35s;z-index:5;font-size:13px}
body.idle #ui, body.hideui #ui{opacity:0;pointer-events:none}
#ui button{background:#1b2233;color:#e8ecf5;border:1px solid #2c3550;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
#bar{position:relative;flex:1;height:8px;background:#1b2233;border-radius:4px;cursor:pointer}
#fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--c1),var(--c5),var(--c2));border-radius:4px}
.tick{position:absolute;top:-4px;width:2px;height:16px;background:#5b6584}
#time{font-family:"JetBrains Mono",Consolas,monospace;color:#aab3c8;min-width:110px}
.hint{color:#6f7891}
@media (max-width:900px){.hint{display:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="sec"><span class="num">01</span><span class="bar"></span><span class="t">Sección</span></div>
  <div id="cap" class="empty"></div>
</div>
<div id="ui">
  <button id="pp">❚❚ Pausa</button>
  <button id="rs">↺</button>
  <div id="bar"><div id="fill"></div></div>
  <span id="time">0:00 / 0:00</span>
  <span class="hint">Espacio pausa · ←/→ 5 s · 1–8 escenas · R reiniciar · H ocultar · F pantalla completa</span>
</div>

<script>
/* =========================================================
   Motor: línea de tiempo determinista (se puede adelantar y
   retroceder sin perder sincronía). Lienzo fijo 1920×1080.
   ========================================================= */
const W=1920,H=1080;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const C={bg:'#05070d',ink:'#e8ecf5',dim:'#8a93a8',c1:'#4cc9f0',c2:'#f72585',c3:'#ffb703',c4:'#80ed99',c5:'#b388ff'};
const FONT='Inter,"Segoe UI",system-ui,sans-serif', MONO='"JetBrains Mono",Consolas,monospace';

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E=(t,a,b)=>eio(seg(t,a,b));
const EO=(t,a,b)=>eout(seg(t,a,b));
const win=(t,a,b,f=.5)=>clamp(Math.min((t-a)/f,(b-t)/f));
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

function txt(s,x,y,o={}){
  ctx.save();ctx.globalAlpha*=(o.a??1);
  ctx.font=`${o.w||400} ${o.s||28}px ${o.mono?MONO:FONT}`;
  if(o.ls)ctx.letterSpacing=o.ls;
  ctx.fillStyle=o.c||C.ink;ctx.textAlign=o.al||'left';ctx.textBaseline=o.bl||'middle';
  if(o.glow){ctx.shadowColor=o.glowc||o.c;ctx.shadowBlur=o.glow;}
  if(o.stroke){ctx.strokeStyle=o.c;ctx.lineWidth=o.stroke;ctx.strokeText(s,x,y);}else ctx.fillText(s,x,y);
  ctx.restore();
}
function tw(s,o={}){ctx.save();ctx.font=`${o.w||400} ${o.s||28}px ${o.mono?MONO:FONT}`;const w=ctx.measureText(s).width;ctx.restore();return w;}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function dot(x,y,r,c,a=1,glow=0){ctx.save();ctx.globalAlpha*=a;if(glow){ctx.shadowColor=c;ctx.shadowBlur=glow;}ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();ctx.restore();}
function arrow(x1,y1,x2,y2,c,a=1,p=1,lw=3,hd=13,dash){
  if(p<=0||a<=0)return;
  const x=lerp(x1,x2,p),y=lerp(y1,y2,p),an=Math.atan2(y2-y1,x2-x1);
  ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x-Math.cos(an)*hd*.6,y-Math.sin(an)*hd*.6);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(an-.45)*hd,y-Math.sin(an-.45)*hd);ctx.lineTo(x-Math.cos(an+.45)*hd,y-Math.sin(an+.45)*hd);ctx.closePath();ctx.fill();
  ctx.restore();
}
function panel(x,y,w,h,a=1,lx,ly){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha*=a;
  rrect(x,y,w,h,20);ctx.fillStyle='rgba(255,255,255,.025)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;
  for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(x+w*i/8,y+12);ctx.lineTo(x+w*i/8,y+h-12);ctx.stroke();}
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(x+12,y+h*i/6);ctx.lineTo(x+w-12,y+h*i/6);ctx.stroke();}
  if(lx)txt(lx,x+w-18,y+h-22,{s:19,c:C.dim,al:'right',mono:1});
  if(ly)txt(ly,x+18,y+24,{s:19,c:C.dim,mono:1});
  ctx.restore();
}
function cellColor(v,a=1){return v>=0?rgba(C.c1,clamp(Math.abs(v))*.75*a):rgba(C.c2,clamp(Math.abs(v))*.75*a);}

/* fondo pre-renderizado */
const BG=document.createElement('canvas');BG.width=W;BG.height=H;
(()=>{const b=BG.getContext('2d');const g=b.createRadialGradient(W*.5,H*.38,80,W*.5,H*.5,1250);
  g.addColorStop(0,'#111a2f');g.addColorStop(1,'#04060b');b.fillStyle=g;b.fillRect(0,0,W,H);
  b.fillStyle='rgba(255,255,255,.04)';for(let x=24;x<W;x+=48)for(let y=24;y<H;y+=48)b.fillRect(x,y,2,2);})();

/* =========================================================
   ESCENA 0 · Intro
   ========================================================= */
const INTRO=(()=>{const r=rng(7),P=[];const cen=[[560,700],[960,750],[1360,700]];const col=[C.c3,C.c5,C.c1];
  for(let i=0;i<180;i++){const k=i%3;P.push({sx:r()*W,sy:r()*H,tx:cen[k][0]+gauss(r)*70,ty:cen[k][1]+gauss(r)*42,k,ph:r()*6.28,d:r()*.9});}
  return{P,cen,col};})();
function drawIntro(t){
  const {P,cen,col}=INTRO;
  for(const p of P){const q=E(t,.2+p.d,3.6+p.d);
    const x=lerp(p.sx+Math.sin(t*.6+p.ph)*40,p.tx,q)+Math.sin(t*1.4+p.ph)*3*q;
    const y=lerp(p.sy+Math.cos(t*.5+p.ph)*40,p.ty,q)+Math.cos(t*1.2+p.ph)*3*q;
    dot(x,y,3.2,col[p.k],.3+.7*q,12*q);}
  const a=E(t,.7,1.9);
  const g=ctx.createLinearGradient(560,0,1360,0);g.addColorStop(0,C.c1);g.addColorStop(.5,C.c5);g.addColorStop(1,C.c2);
  txt('EMBEDDINGS',W/2,350+(1-a)*40,{s:150,w:800,al:'center',a,c:g,ls:'14px'});
  const b=E(t,2,3);
  txt('Representar cualquier cosa como un vector…',W/2,470+(1-b)*20,{s:40,al:'center',a:b,c:C.ink});
  const b2=E(t,2.8,3.8);
  txt('…donde la distancia tiene significado',W/2,528+(1-b2)*20,{s:40,al:'center',a:b2,c:C.dim});
  ['categorías','señales','imágenes'].forEach((s,k)=>{const q=E(t,4.2+k*.3,5+k*.3);
    txt(s,cen[k][0],cen[k][1]+115,{s:30,w:600,al:'center',a:q,c:col[k]});});
}

/* =========================================================
   Tarjetas de sección
   ========================================================= */
function makeCard(num,title,sub,col){
  return t=>{
    const a=E(t,.15,1);
    txt(num,W/2,410,{s:300,w:800,al:'center',a:a*.9,c:col,stroke:3});
    txt(num,W/2,410,{s:300,w:800,al:'center',a:a*.12,c:col});
    const b=E(t,.5,1.4);
    txt(title,W/2,615+(1-b)*24,{s:86,w:800,al:'center',a:b});
    const L=lerp(0,520,E(t,.8,1.8));
    ctx.save();ctx.fillStyle=col;ctx.globalAlpha=b;ctx.fillRect(W/2-L/2,675,L,3);ctx.restore();
    const c=E(t,1.1,2);
    txt(sub,W/2,730+(1-c)*16,{s:36,al:'center',a:c,c:C.dim});
  };
}

/* =========================================================
   ESCENA 1 · Variables cualitativas
   clientes → ordinal encoding → one-hot → desventajas →
   diccionario → embeddings 2D → embeddings 3D
   ========================================================= */
const CITY=['Bogotá','Lima','Madrid','Osaka','Quito','Sevilla','Tokio'];
const ABBR=['BOG','LIM','MAD','OSA','QUI','SEV','TOK'];
const CGRP=[0,0,1,2,0,1,2];
const GCOL=[C.c3,C.c2,C.c1],GNAME=['Latinoamérica','España','Japón'];
const CLIENTS=[[1,'Ana',34,1,120],[2,'Jorge',41,2,260],[3,'Kenji',29,6,310],[4,'Sofía',52,0,95],[5,'Luis',23,1,80],[6,'Lucía',37,5,210],[7,'Yuki',45,3,290],[8,'Diego',31,4,70]];
// órdenes ilustrativos (de menor a mayor)
const ORDERS=[
  ['orden alfabético',[0,1,2,3,4,5,6]],
  ['¿por área?',[5,3,4,2,6,0,1]],
  ['¿por densidad poblacional?',[4,1,5,0,2,3,6]],
  ['¿por costo de vida?',[4,0,1,5,2,3,6]],
  ['¿por nº de cafeterías?',[4,5,1,0,3,2,6]]];
const ORD_T=[8,12,14,16,18];
const rankOf=(o,c)=>ORDERS[o][1].indexOf(c);
function ordState(t){let o=0;for(let i=0;i<ORD_T.length;i++)if(t>=ORD_T[i])o=i;
  const p=o>0?E(t,ORD_T[o],ORD_T[o]+.8):1;
  return{o,p,r:c=>o>0?lerp(rankOf(o-1,c),rankOf(o,c),p):rankOf(0,c)};}

const TY0=230,RH=48,TCOL=[56,120,84,150,120],TW=530;
function drawClients(x,t){
  rrect(x,TY0,TW,RH,10);ctx.fillStyle='rgba(255,255,255,.06)';ctx.fill();
  let cx=x;['id','cliente','edad','ciudad','gasto/mes'].forEach((h,j)=>{txt(h,cx+16,TY0+RH/2,{s:19,c:C.dim,mono:1});cx+=TCOL[j];});
  const limaHL=win(t,31,36.4,.5);
  CLIENTS.forEach((r,i)=>{
    const a=E(t,.4+i*.14,.95+i*.14),yy=TY0+RH*(i+1);
    ctx.save();ctx.globalAlpha*=a;ctx.translate((1-a)*-24,0);
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yy+RH);ctx.lineTo(x+TW,yy+RH);ctx.stroke();
    let cx=x;txt(String(r[0]),cx+16,yy+RH/2,{s:20,c:C.dim,mono:1});cx+=TCOL[0];
    txt(r[1],cx+16,yy+RH/2,{s:22});cx+=TCOL[1];
    txt(String(r[2]),cx+16,yy+RH/2,{s:20,mono:1});cx+=TCOL[2];
    txt(CITY[r[3]],cx+16,yy+RH/2,{s:23,w:600,c:(r[3]===1&&limaHL>0)?C.c3:C.ink});cx+=TCOL[3];
    txt('$'+r[4],cx+16,yy+RH/2,{s:20,mono:1});
    ctx.restore();
  });
  const hA=E(t,3,3.8)*(1-.7*E(t,23,24));
  if(hA>0){const hx=x+TCOL[0]+TCOL[1]+TCOL[2];ctx.save();ctx.globalAlpha*=hA*(.75+.25*Math.sin(t*4));ctx.strokeStyle=C.c5;ctx.lineWidth=3;
    ctx.shadowColor=C.c5;ctx.shadowBlur=18;rrect(hx+4,TY0-6,TCOL[3]-8,RH*9+12,12);ctx.stroke();ctx.restore();
    txt('variable cualitativa',hx+TCOL[3]/2,TY0-32,{s:21,w:600,c:C.c5,al:'center',a:E(t,3.3,4.1)*(1-E(t,7.4,8))});}
  // columna ordinal
  const oA=win(t,8.2,23.4,.5);
  if(oA>0){const st=ordState(t),ox=x+TW+10;ctx.save();ctx.globalAlpha*=oA;
    rrect(ox,TY0,120,RH,10);ctx.fillStyle=rgba(C.c5,.14);ctx.fill();
    txt('ciudad_ord',ox+60,TY0+RH/2,{s:18,c:C.c5,mono:1,al:'center'});
    CLIENTS.forEach((r,i)=>{const yy=TY0+RH*(i+1),v=Math.round(st.r(r[3]))+1;
      const pulse=st.o>0?1-seg(t,ORD_T[st.o],ORD_T[st.o]+.8):0;
      txt(String(v),ox+60,yy+RH/2,{s:24,w:600,mono:1,al:'center',c:pulse>0?C.c3:C.ink});});
    ctx.restore();}
  // filas idénticas (Lima)
  if(limaHL>0)CLIENTS.forEach((r,i)=>{if(r[3]!==1)return;const yy=TY0+RH*(i+1);
    ctx.save();ctx.globalAlpha*=limaHL;rrect(x-6,yy+3,1012-x,RH-6,10);ctx.strokeStyle=C.c3;ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.stroke();ctx.restore();});
}

/* valores de embedding */
const EMB_INIT=(()=>{const r=rng(11);return CITY.map(()=>[r()*1.8-.9,r()*1.8-.9,r()*.6-.3]);})();
const EMB2=[[-.52,.72],[-.70,.55],[.10,-.60],[.86,.34],[-.80,.34],[.32,-.76],[.70,.55]];
const EMB3=[[-.55,.66,-.62],[-.68,.50,.62],[.12,-.58,-.58],[.84,.38,.52],[-.80,.30,-.72],[.30,-.72,.62],[.64,.56,.40]];
function embAt(t,i){
  const p=seg(t,63.5,71.5),q=eio(p),j=4*p*(1-p);
  let x=lerp(EMB_INIT[i][0],EMB2[i][0],q)+.10*j*Math.sin(t*9+i*2.1),
      y=lerp(EMB_INIT[i][1],EMB2[i][1],q)+.10*j*Math.cos(t*8+i*1.7),z=EMB_INIT[i][2];
  const p3=seg(t,79,87),q3=eio(p3),j3=4*p3*(1-p3);
  x=lerp(x,EMB3[i][0],q3)+.06*j3*Math.sin(t*9+i);y=lerp(y,EMB3[i][1],q3)+.06*j3*Math.cos(t*7+i);
  z=lerp(z,EMB3[i][2],q3)+.12*j3*Math.sin(t*8+i*2.3);
  return[x,y,z];
}
const fmt=v=>(v<0?'−':' ')+Math.abs(v).toFixed(2);
const BOOKW=['ábaco','abeja','árbol','barco','casa','dado','elfo','faro','gato','hilo','isla','jugo','kiwi'];
const BOOKH=(()=>{const r=rng(17);return BOOKW.map(()=>280+r()*90);})();

function drawCat(t){
  /* ---------- tabla de clientes (A–D) ---------- */
  const tA=win(t,0,46.8,.6);
  const tx=lerp(W/2-TW/2,70,E(t,6.4,7.5));
  if(tA>0){ctx.save();ctx.globalAlpha=tA;drawClients(tx,t);ctx.restore();}

  /* ---------- B: ordinal encoding ---------- */
  const aB=win(t,8.6,23.4,.5);
  if(aB>0){ctx.save();ctx.globalAlpha=aB;
    const st=ordState(t),x0=860,x1=1780,ly=530;
    txt('ordinal encoding',1320,290,{s:22,mono:1,al:'center',c:C.c5});
    ORDERS.forEach((o,k)=>{const a=k===st.o?E(t,ORD_T[k],ORD_T[k]+.45):0;if(a>0)txt(o[0],1320,355,{s:46,w:800,al:'center',a,c:k?C.c3:C.ink});});
    ctx.strokeStyle='rgba(232,236,245,.45)';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x0-30,ly);ctx.lineTo(x1+30,ly);ctx.stroke();
    for(let k=0;k<7;k++){const x=x0+k/6*(x1-x0);ctx.beginPath();ctx.moveTo(x,ly-8);ctx.lineTo(x,ly+8);ctx.stroke();txt(String(k+1),x,ly+32,{s:22,mono:1,al:'center',c:C.dim});}
    const shake=E(t,20.2,20.8);
    CITY.forEach((n,c)=>{const r=st.r(c),x=x0+r/6*(x1-x0)+Math.sin(t*7+c*2)*14*shake;
      const lift=st.o>0?Math.sin(st.p*Math.PI)*55*(c%2?1:-1):0;
      const rr=Math.round(r);
      dot(x,ly-lift*.4,10,GCOL[CGRP[c]],1,16);
      txt(n,x,ly-36-(rr%2)*34-Math.max(0,lift),{s:22,w:600,al:'center'});});
    const eqA=win(t,9.8,11.9,.4);
    txt('Bogotá (1) + Lima (2) = Madrid (3)  ?!',1320,650,{s:34,w:600,al:'center',c:C.c2,a:eqA});
    txt('órdenes ilustrativos',1320,640,{s:18,mono:1,al:'center',c:C.dim,a:win(t,12.2,20,.4)});
    txt('no tiene un orden inherente',1320,660,{s:42,w:800,al:'center',c:C.c2,a:E(t,20.4,21)});
    ctx.restore();}

  /* ---------- C: cada ciudad en su propio eje ---------- */
  const aC=win(t,23.6,37.6,.6);
  if(aC>0){ctx.save();ctx.globalAlpha=aC;
    const O=[1500,600],A=[[O[0]+200,O[1]+115,1],[O[0],O[1]-240,2],[O[0]-200,O[1]+115,6]];
    txt('cada ciudad en su propio eje',O[0],270,{s:30,w:800,al:'center',a:E(t,23.8,24.6)});
    A.forEach((a,k)=>{const q=E(t,24.2+k*.4,25+k*.4);
      arrow(O[0],O[1],a[0],a[1],'rgba(232,236,245,.6)',1,q,2.5,12);
      txt(CITY[a[2]],a[0]+(a[0]-O[0])*.12,a[1]+(a[1]-O[1])*.12+(k===1?-10:16),{s:24,w:600,al:'center',a:q,c:GCOL[CGRP[a[2]]]});});
    const P=A.map(a=>[lerp(O[0],a[0],.72),lerp(O[1],a[1],.72)]);
    const pq=E(t,25.6,26.3);
    for(let e=0;e<3;e++){const p1=P[e],p2=P[(e+1)%3],q=E(t,26+e*.3,26.6+e*.3);
      ctx.strokeStyle='rgba(232,236,245,.5)';ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.lineTo(lerp(p1[0],p2[0],q),lerp(p1[1],p2[1],q));ctx.stroke();ctx.setLineDash([]);

const STAT=(()=>{const N=400,a=[],b=[];for(let i=0;i<N;i++){const u=i/(N-1);a.push(fn(0,u));b.push(fn(0,1-u));}
  const c=a.slice();const oi=Math.round(.7*N);for(let i=-2;i<=2;i++)c[oi+i]+=2.2*(1-Math.abs(i)/3);
  const st=x=>{const n=x.length,m=x.reduce((s,v)=>s+v,0)/n;let v=0,s3=0,e=0;x.forEach(q=>{v+=(q-m)**2;s3+=(q-m)**3;e+=q*q;});v/=n;
    let bk=1,bm=0;for(let k=1;k<30;k++){let re=0,im=0;x.forEach((q,j)=>{re+=(q-m)*Math.cos(6.2832*k*j/n);im-=(q-m)*Math.sin(6.2832*k*j/n);});const mg=Math.hypot(re,im);if(mg>bm){bm=mg;bk=k;}}
    return[m,v,(s3/n)/Math.pow(v,1.5),bk,e/n];};
  return{N,a,b,c,sa:st(a),sb:st(b),sc:st(c)};})();

    txt(b[0],x+26,y+44,{s:28,w:800});txt(`${b[2]} meses · máx $${b[3].toLocaleString('es-ES')}`,x+26,y+84,{s:17,mono:1,c:C.dim});
    const w=380*b[2]/24,h=lh(b[3]);spark(x+250,y+61+h/2,w,h,b[1],TS_COL[b[1]],1,3,.03,11+i,6);
    const sq=E(t,3.6+i*.2,4.8+i*.2),bx=x+700;
    txt('similitud',bx,y+36,{s:17,mono:1,c:C.dim});
    rrect(bx,y+58,220,18,9);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill();
    rrect(bx,y+58,Math.max(8,220*b[4]*sq),18,9);ctx.fillStyle=b[4]>.8?C.c4:C.c2;ctx.fill();
    txt((b[4]*sq).toFixed(2),bx+300,y+67,{s:30,w:800,mono:1,al:'right',c:b[4]>.8?C.c4:C.ink});
    if(b[5]){const lx=x+26+tw(b[0],{s:28,w:800})+14;rrect(lx,y+30,tw(b[5],{s:17,w:600})+20,28,14);ctx.fillStyle=rgba(C.c3,.15*hl);ctx.fill();txt(b[5],lx+10,y+44,{s:17,w:600,c:C.c3,a:hl});}
    if(top2)txt('similar ✓',x+1005,y+36,{s:20,w:800,al:'right',c:C.c4,a:hl});
    ctx.restore();});
}
function drawTS(t){
  if(t<15.2)drawTSStats(t);
  if(t>=14.6&&t<65.4){const tc=t-15;ctx.save();ctx.globalAlpha=1;drawTSCore(Math.max(0,tc));ctx.restore();
    const f=Math.max(1-clamp((t-14.6)/.6),clamp((tc-49.5)/.6));if(f>0){ctx.fillStyle=`rgba(4,6,11,${f})`;ctx.fillRect(0,0,W,H);}}
  if(t>=65){ctx.save();ctx.globalAlpha=clamp((t-65)/.6);drawTSApp(t-65);ctx.restore();}
}
/* =========================================================
   ESCENA 4 · Cierre
   ========================================================= */
const OUT_V=[0,1,2].map(i=>{const r=rng(200+i);return Array.from({length:6},()=>r()*2-1);});
function drawOutro(t){
  const X=[420,960,1500],top=250;
  ['categoría','señal','imagen'].forEach((lab,k)=>{const q=EO(t,.3+k*.5,1.1+k*.5);
    ctx.save();ctx.globalAlpha*=q;ctx.translate(0,(1-q)*40+Math.sin(t*1.5+k)*4);
    txt(lab,X[k],top-50,{s:26,w:600,al:'center',c:C.dim});
    if(k===0){const w=tw('Sevilla',{s:34,w:600})+50;rrect(X[k]-w/2,top+20,w,70,35);ctx.fillStyle=rgba(C.c2,.14);ctx.fill();ctx.strokeStyle=C.c2;ctx.lineWidth=2;ctx.stroke();txt('Sevilla',X[k],top+56,{s:34,w:600,al:'center',c:C.c2});}
    if(k===2)drawScene({circ:.8,sq:.05,size:.6,thick:.35,rough:.25,green:.9,beauty:.9},X[k]-90,top-10,180,131,t);
    if(k===1){rrect(X[k]-110,top,220,120,14);ctx.fillStyle='rgba(255,255,255,.03)';ctx.fill();spark(X[k]-95,top+100,190,80,3,C.c4,1,3.5,.02,2,10);}
    ctx.restore();
    arrow(X[k],top+140,X[k],top+220,'rgba(232,236,245,.45)',E(t,1.8+k*.2,2.4+k*.2),E(t,1.8+k*.2,2.4+k*.2),3,13);
    OUT_V[k].forEach((v,i)=>{const qq=E(t,2.4+k*.2+i*.06,2.9+k*.2+i*.06);ctx.save();ctx.globalAlpha*=qq;rrect(X[k]-138+i*47,top+245,42,42,7);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fill();ctx.fillStyle=cellColor(v);ctx.fill();ctx.restore();});
  });
  const a=E(t,4,5.2);
  const g=ctx.createLinearGradient(600,0,1320,0);g.addColorStop(0,C.c1);g.addColorStop(.5,C.c5);g.addColorStop(1,C.c2);
  txt('Embeddings',W/2,720+(1-a)*30,{s:110,w:800,al:'center',c:g,a});
  txt('cerca en el espacio  =  parecido en significado',W/2,815,{s:36,al:'center',a:E(t,5.4,6.3)});
  txt('aprendidos de los datos · para buscar, agrupar, recomendar y predecir',W/2,875,{s:26,al:'center',c:C.dim,a:E(t,6.6,7.5)});
}

/* =========================================================
   Guion: escenas, sección y narración en pantalla
   ========================================================= */
const SCENES=[
  {name:'Intro',dur:7,draw:drawIntro,cap:[]},
  {name:'Tarjeta 1',dur:3.6,draw:makeCard('01','Variables cualitativas','entity embeddings para datos tabulares',C.c3),cap:[]},
  {name:'Categóricas',dur:133,draw:drawCat,sec:['01','Variables cualitativas',C.c3],cap:[
    [.5,6.8,'Una tabla de clientes. La columna <b>ciudad</b> es una variable <b>cualitativa</b>: categorías, no números.'],
    [7.5,11.8,'¿Y si le damos a cada ciudad un número? Eso es <b>ordinal encoding</b>… pero el modelo creería que Bogotá + Lima = Madrid.'],
    [12,19.9,'¿Cómo las ordenaríamos? ¿Por <b>área</b>? ¿Por <b>densidad</b>? ¿Por <b>costo de vida</b>? ¿Por cuál tiene más <b>cafeterías</b>?'],
    [20.2,23.1,'En realidad no lo sabemos: esta variable <b>no tiene un orden inherente</b>.'],
    [23.7,28.4,'¿Y si no las ordenamos? Pongamos cada ciudad en un <b>eje diferente</b>, como si fueran features separados.'],

    [37.6,46.2,'Pero tiene una gran desventaja: más entradas y más parámetros. El procesamiento se vuelve <b>pesado, lento e ineficiente</b>… y casi todo son ceros.'],
    [46.8,53.1,'Es como escribir un diccionario poniendo <b>cada palabra en un libro diferente</b>. No tiene sentido.'],

    [63.7,71.7,'Esos números se <b>aprenden</b> al entrenar con la tarea (p. ej. predecir el gasto): ciudades con clientes parecidos terminan cerca.'],
    [72,75.8,'En 2D ya aparecen grupos: Latinoamérica, España y Japón.'],
    [76.4,86.9,'Con una <b>tercera dimensión</b> hay espacio para más matices…'],
    [87.3,93.6,'…los grupos se mantienen, pero aparece otra relación (por ejemplo, <b>costa vs. altura</b>) que en 2D no cabía.'],
    [94.6,100,'Ojo: esta ubicación <b>no es única</b>. Con los mismos clientes y la misma variable ciudad, otro modelo puede generar un mapa totalmente distinto.'],
    [100.3,107.6,'Depende de la <b>variable objetivo</b> y de las <b>demás features</b>. Pero siempre buscará la ubicación que haga la <b>loss</b> lo más pequeña posible.'],
    [108.4,112.6,'En principio, cada dimensión no tiene por qué significar nada: es solo un eje que el modelo creó para equivocarse menos.'],
    [112.9,117.5,'Pero algo fascinante del deep learning: pasa, más de lo que uno pensaría, que esas dimensiones coinciden con <b>conceptos que los humanos entendemos</b>.'],
    [117.8,122.4,'Eso no significa que el modelo lo hiciera a propósito: no conoce esos conceptos. La <b>interpretación es nuestra</b>.'],
    [122.7,127.8,'Y no: cuando tengan embeddings de 500 dimensiones, no intenten buscarle significado a las 500 😂'],
    [128.3,132.6,'El embedding se concatena con las demás variables y se <b>entrena junto con el modelo</b>.']]},
  {name:'Tarjeta 2',dur:3.6,draw:makeCard('02','Señales en el tiempo','el ADN de una señal: su forma',C.c4),cap:[]},
  {name:'Señales',dur:77.5,draw:drawTS,sec:['02','Señales en el tiempo',C.c4],cap:[
    [.5,5.2,'Para identificar una señal solemos usar estadísticas clásicas: <b>media, varianza, skew, frecuencia, energía</b>…'],

    [8.7,12.2,'Y un solo <b>outlier</b> puede cambiarlas casi todas.'],
    [12.6,14.8,'Con embeddings podemos crear un vector que represente el verdadero <b>ADN</b> de la señal.'],
    ...[[.5,5.8,'Tres señales con la <b>misma forma</b>: suben rápido y decaen lento… con distinta <b>duración</b> y <b>amplitud</b>.'],
    [6.2,10.4,'Comparadas punto a punto parecen muy distintas: la distancia euclidiana <b>no ve la forma</b>.'],

    [30.5,36,'Cada punto es una señal completa. Mira sus tamaños: duraciones y amplitudes muy distintas…'],
    [36.3,42,'…pero se agrupan por su <b>forma y evolución</b>.'],
    [42.5,49.5,'Entrenamiento <b>contrastivo</b>: versiones estiradas, escaladas o con outliers de una señal se acercan; formas distintas se alejan.']].map(c=>[c[0]+15,c[1]+15,c[2]]),
    [65.4,71,'Con esto podemos comparar las gráficas de compra de los clientes…'],
    [71.3,77,'…y encontrar los que se comportan <b>igual</b>, aunque gasten 8 veces más o lleven solo 9 meses.']]},
  {name:'Tarjeta 3',dur:3.6,draw:makeCard('03','Imágenes','cada número, una característica visual',C.c1),cap:[]},
  {name:'Imágenes',dur:50,draw:drawImg,sec:['03','Imágenes',C.c1],cap:[
    [.5,5.8,'Un <b>encoder</b> lee la imagen y la resume en un vector: cada número captura una <b>característica visual de alto nivel</b>.'],
    [6.2,10.8,'Si la copa se vuelve <b>más o menos circular</b>, cambia el número que mide qué tan circular es…'],
    [11.2,15.8,'…si se vuelve <b>cuadrada</b>, lo registra otro número…'],
    [16.2,20.8,'…si el árbol <b>crece o se encoge</b>, cambia su tamaño en el vector…'],
    [21.2,25.8,'…si el tronco es <b>más grueso o más delgado</b>…'],
    [26.2,30.8,'…si la textura se vuelve <b>más rugosa</b>…'],
    [31.2,35.8,'…si es <b>más o menos verde</b>…'],
    [36.2,44.2,'…e incluso algo abstracto: qué tan <b>bella</b> es la imagen.'],
    [44.6,49.6,'Cada cambio en la imagen se refleja en su vector: <b>imágenes parecidas → vectores parecidos</b>.']]},
  {name:'Cierre',dur:11,draw:drawOutro,cap:[]},
];
let acc=0;SCENES.forEach(s=>{s.start=acc;acc+=s.dur;});const TOTAL=acc;

/* =========================================================
   Render + reproducción
   ========================================================= */
const capEl=document.getElementById('cap'),secEl=document.getElementById('sec');
let T=0,playing=true,last=null,lastCap='',lastSec='';
function sceneAt(t){for(let i=SCENES.length-1;i>=0;i--)if(t>=SCENES[i].start)return i;return 0;}
function render(){
  const i=sceneAt(Math.min(T,TOTAL-1e-4)),S=SCENES[i],lt=clamp(T-S.start,0,S.dur);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(BG,0,0);
  // halos de color que se desplazan lentamente en el fondo
  [[C.c5,.5,.3,.11],[C.c1,.8,.7,.09],[C.c2,.25,.75,.07]].forEach((b,k)=>{const x=W*(b[1]+.12*Math.sin(T*.11+k*2)),y=H*(b[2]+.1*Math.cos(T*.13+k));
    const g=ctx.createRadialGradient(x,y,0,x,y,620);g.addColorStop(0,rgba(b[0],b[3]));g.addColorStop(1,rgba(b[0],0));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);});
  // ligero zoom de entrada en cada escena
  const zi=1+.035*(1-eout(clamp(lt/1.2)));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zi,zi);ctx.translate(-W/2,-H/2);S.draw(lt,S.dur);ctx.restore();
  // fundido entre escenas
  const f=Math.max(clamp(1-lt/.45),i===SCENES.length-1?clamp(1-(S.dur-lt)/1.2):clamp(1-(S.dur-lt)/.45));
  if(f>0){ctx.fillStyle=`rgba(4,6,11,${f})`;ctx.fillRect(0,0,W,H);}
  // narración
  let c=null;for(const k of S.cap)if(lt>=k[0]&&lt<=k[1]){c=k;break;}
  if(c){if(lastCap!==c[2]){capEl.innerHTML=c[2];capEl.classList.remove('empty');lastCap=c[2];}
    const o=win(lt,c[0],c[1],.35);capEl.style.opacity=o;capEl.style.transform=`translateX(-50%) translateY(${(1-o)*14}px)`;}
  else{capEl.style.opacity=0;}
  // sección
  if(S.sec){const key=S.sec.join();if(key!==lastSec){secEl.querySelector('.num').textContent=S.sec[0];secEl.querySelector('.t').textContent=S.sec[1];secEl.style.setProperty('--secc',S.sec[2]);lastSec=key;}
    const o=clamp(Math.min((lt-.3)/.6,(S.dur-lt)/.45));secEl.style.opacity=o;secEl.style.transform=`translateX(${(1-o)*-20}px)`;}
  else secEl.style.opacity=0;
  // UI
  document.getElementById('fill').style.width=(T/TOTAL*100)+'%';
  const m=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  document.getElementById('time').textContent=`${m(T)} / ${m(TOTAL)}`;
}
function frame(ts){
  if(last==null)last=ts;const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(playing){T+=dt;if(T>=TOTAL){T=TOTAL;setPlay(false);}}
  render();requestAnimationFrame(frame);
}
const ppBtn=document.getElementById('pp');
function setPlay(p){playing=p;ppBtn.textContent=p?'❚❚ Pausa':'▶ Reproducir';}
ppBtn.onclick=()=>{if(T>=TOTAL)T=0;setPlay(!playing);};
document.getElementById('rs').onclick=()=>{T=0;setPlay(true);};
const bar=document.getElementById('bar');
SCENES.forEach(s=>{if(!s.start)return;const d=document.createElement('div');d.className='tick';d.style.left=(s.start/TOTAL*100)+'%';bar.appendChild(d);});
bar.onclick=e=>{const r=bar.getBoundingClientRect();T=clamp((e.clientX-r.left)/r.width)*TOTAL;};
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();ppBtn.onclick();}
  else if(e.key==='ArrowRight')T=Math.min(TOTAL,T+5);
  else if(e.key==='ArrowLeft')T=Math.max(0,T-5);
  else if(e.key==='r'||e.key==='R'){T=0;setPlay(true);}
  else if(e.key==='h'||e.key==='H')document.body.classList.toggle('hideui');
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  else if(/^[1-8]$/.test(e.key)){const s=SCENES[+e.key-1];if(s)T=s.start;}
});
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2200);});
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
// ?t=segundos para saltar a un instante
const qt=parseFloat(new URLSearchParams(location.search).get('t'));if(!isNaN(qt))T=qt;
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(()=>requestAnimationFrame(frame));
</script>
